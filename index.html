
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة المخمسات</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f3f4f6;
    color: #172033;
}

.container {
    max-width: 460px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

h1 {
    margin: 0 0 8px;
    text-align: center;
}

.sub {
    text-align: center;
    color: #667085;
    margin-bottom: 24px;
}

label {
    display: block;
    font-weight: bold;
    margin: 14px 0 7px;
}

input, select, button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    font-size: 17px;
}

input, select {
    border: 1px solid #d0d5dd;
    background: white;
}

button {
    border: 0;
    background: #172033;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 18px;
}

.result {
    margin-top: 22px;
    padding: 20px;
    border-radius: 16px;
    background: #f1f5f9;
}

.result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 17px;
    font-weight: bold;
    padding: 5px 0;
}

.result-value {
    text-align: left;
    font-size: 21px;
    overflow-wrap: anywhere;
}

.result-line {
    border: 0;
    border-top: 2px solid #98a2b3;
    margin: 12px 0;
}
</style>
</head>

<body>
<div class="container">
<div class="card">

<h1>حاسبة عدد المخمسات</h1>
<div class="sub">احسب عدد المخمسات والأعواد</div>

<label for="type">نوع المخمس</label>
<select id="type">
    <option value="12">12 عود</option>
    <option value="6">6 أعواد</option>
</select>

<label for="length">الطول</label>
<input id="length" type="number" min="0" step="any"
placeholder="أدخل الطول">

<label for="width">العرض</label>
<input id="width" type="number" min="0" step="any"
placeholder="أدخل العرض">

<button onclick="calculate()">احسب</button>

<div class="result">
    <div class="result-row">
        <span>عدد المخمسات:</span>
        <span id="result" class="result-value">—</span>
    </div>

    <hr class="result-line">

    <div class="result-row">
        <span>عدد العدان:</span>
        <span id="remainingSticks" class="result-value">—</span>
    </div>
</div>

</div>
</div>

<script>
function formatResult(n) {
    const totalUnits = Math.round(n * 100);
    const whole = Math.floor(totalUnits / 100);
    const remainder = totalUnits % 100;
    const quarters = Math.floor(remainder / 25);

    let parts = [];

    if (whole > 0) {
        parts.push(String(whole));
    }

    if (quarters === 1) {
        parts.push("ربع");
    } else if (quarters === 2) {
        parts.push("نص");
    } else if (quarters === 3) {
        parts.push("ثلاثة أرباع");
    }

    if (parts.length === 0) {
        return "أقل من ربع";
    }

    return parts.join(" و ");
}

function calculate() {
    const lengthInput = document.getElementById("length");
    const widthInput = document.getElementById("width");
    const result = document.getElementById("result");
    const remainingSticks = document.getElementById("remainingSticks");
    const type = document.getElementById("type").value;

    const length = Number(lengthInput.value);
    const width = Number(widthInput.value);

    if (
        lengthInput.value.trim() === "" ||
        widthInput.value.trim() === "" ||
        !Number.isFinite(length) ||
        !Number.isFinite(width) ||
        length <= 0 ||
        width <= 0
    ) {
        result.textContent = "أدخل الطول والعرض";
        remainingSticks.textContent = "—";
        return;
    }

    let n;

    if (type === "12") {
        n = (length * 2 * width * 2) / 600;
    } else {
        n = (length * width) / 600;
    }

    const totalUnits = Math.round(n * 100);
    const sticks = (totalUnits % 100) % 25;

    result.textContent = formatResult(n);
    remainingSticks.textContent = sticks + " عود";
}
</script>

</body>
</html>
